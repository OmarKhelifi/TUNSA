---
name: Test SSH et déploiement Ansible via Tailscale

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tunsa-tailscale-ansible
  cancel-in-progress: false

jobs:
  test-and-configure:
    name: SSH et Ansible via GitHub-hosted runner
    runs-on: ubuntu-latest

    # L'installation d'Ansible et apt sur les VM ARM64 peut être lente.
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les fichiers Ansible du dépôt
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f ansible/inventory.ini || {
            echo "Fichier absent : ansible/inventory.ini" >&2
            exit 1
          }

          test -f ansible/playbooks/install-package.yml || {
            echo "Fichier absent : ansible/playbooks/install-package.yml" >&2
            exit 1
          }

          echo "Fichiers Ansible trouvés :"
          printf '%s\n' \
            "ansible/inventory.ini" \
            "ansible/playbooks/install-package.yml"

      - name: Connecter le runner à Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Afficher l'état Tailscale
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Adresse Tailscale du runner :"
          tailscale ip -4

          echo
          echo "État du tailnet :"
          tailscale status

          echo
          echo "Routes Tailscale :"
          ip rule show
          ip route show table 52 || true

          echo
          echo "Route vers les émulateurs :"
          ip route get 10.50.0.11
          ip route get 10.50.0.12

      - name: Préparer SSH et charger la clé chiffrée
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          private_key="${SSH_PRIVATE_KEY:-}"
          passphrase="${SSH_KEY_PASSPHRASE:-}"
          known_hosts="${SSH_KNOWN_HOSTS:-}"

          [[ -n "${private_key}" ]] || {
            echo "SSH_PRIVATE_KEY est absent ou vide." >&2
            exit 1
          }

          [[ -n "${passphrase}" ]] || {
            echo "SSH_KEY_PASSPHRASE est absent ou vide." >&2
            exit 1
          }

          [[ -n "${known_hosts}" ]] || {
            echo "SSH_KNOWN_HOSTS est absent ou vide." >&2
            exit 1
          }

          install -d -m 700 "${HOME}/.ssh"

          printf '%s\n' "${private_key}" |
            tr -d '\r' > "${HOME}/.ssh/tunsa_ansible"

          printf '%s\n' "${known_hosts}" |
            tr -d '\r' > "${HOME}/.ssh/known_hosts"

          chmod 600 \
            "${HOME}/.ssh/tunsa_ansible" \
            "${HOME}/.ssh/known_hosts"

          # Démarrer l'agent SSH.
          eval "$(ssh-agent -s)"

          # Rendre l'agent disponible aux étapes suivantes.
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "${GITHUB_ENV}"

          # Script temporaire utilisé par ssh-add pour lire la passphrase.
          askpass_script="${RUNNER_TEMP}/ssh-askpass.sh"

          cat > "${askpass_script}" <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "${SSH_KEY_PASSPHRASE}"
          ASKPASS

          chmod 700 "${askpass_script}"

          echo "Chargement de la clé dans ssh-agent..."

          DISPLAY=:0 \
          SSH_ASKPASS="${askpass_script}" \
          SSH_ASKPASS_REQUIRE=force \
          setsid -w ssh-add "${HOME}/.ssh/tunsa_ansible" </dev/null

          rm -f "${askpass_script}"

          echo "Clé chargée dans ssh-agent :"
          ssh-add -l

          echo "Empreinte de la clé :"
          ssh-add -L |
            ssh-keygen -lf -

          for host in 10.50.0.11 10.50.0.12; do
            ssh-keygen \
              -F "${host}" \
              -f "${HOME}/.ssh/known_hosts" >/dev/null || {
                echo "Clé d'hôte absente pour ${host}" >&2
                exit 1
              }

            echo "${host} : clé d'hôte présente"
          done

      - name: Tester les deux émulateurs par SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Vérification de ssh-agent..."

          [[ -n "${SSH_AUTH_SOCK:-}" ]] || {
            echo "SSH_AUTH_SOCK est absent." >&2
            exit 1
          }

          [[ -S "${SSH_AUTH_SOCK}" ]] || {
            echo "Socket ssh-agent introuvable : ${SSH_AUTH_SOCK}" >&2
            exit 1
          }

          ssh-add -l || {
            echo "Aucune clé disponible dans ssh-agent." >&2
            exit 1
          }

          wait_for_ssh() {
            local host="$1"
            local attempt

            for attempt in $(seq 1 12); do
              echo "Tentative ${attempt}/12 vers ${host}:22..."

              if timeout 4 bash -c \
                "exec 3<>/dev/tcp/${host}/22" 2>/dev/null; then
                echo "Le port SSH répond sur ${host}."
                return 0
              fi

              sleep 5
            done

            echo "Le port SSH ne répond pas sur ${host}." >&2
            return 1
          }

          test_node() {
            local host="$1"
            local user="$2"
            local expected_hostname="$3"
            local expected_user="$4"

            echo
            echo "========================================"
            echo "Test de ${expected_hostname}"
            echo "Adresse : ${host}"
            echo "Compte  : ${user}"
            echo "========================================"

            wait_for_ssh "${host}"

            ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o "IdentityAgent=${SSH_AUTH_SOCK}" \
              -o ConnectTimeout=10 \
              -o ConnectionAttempts=2 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              -i "${HOME}/.ssh/tunsa_ansible" \
              "${user}@${host}" \
              bash -s -- \
              "${expected_hostname}" \
              "${expected_user}" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          expected_hostname="$1"
          expected_user="$2"

          actual_hostname="$(hostname)"
          actual_user="$(whoami)"
          actual_architecture="$(uname -m)"
          ssh_status="$(systemctl is-active ssh)"

          [[ "${actual_hostname}" == "${expected_hostname}" ]] || {
            echo "Hostname incorrect : ${actual_hostname}" >&2
            exit 1
          }

          [[ "${actual_user}" == "${expected_user}" ]] || {
            echo "Utilisateur incorrect : ${actual_user}" >&2
            exit 1
          }

          [[ "${actual_architecture}" == "aarch64" ]] || {
            echo "Architecture incorrecte : ${actual_architecture}" >&2
            exit 1
          }

          [[ "${ssh_status}" == "active" ]] || {
            echo "Service SSH non actif : ${ssh_status}" >&2
            exit 1
          }

          echo "SSH_OK"
          echo "Hostname     : ${actual_hostname}"
          echo "Utilisateur  : ${actual_user}"
          echo "Architecture : ${actual_architecture}"
          echo "Service SSH  : ${ssh_status}"
          REMOTE_SCRIPT
          }

          test_node \
            "10.50.0.11" \
            "omar" \
            "raspberry-pi-01" \
            "omar"

          test_node \
            "10.50.0.12" \
            "omar2" \
            "raspberry-pi-02" \
            "omar2"

      - name: Installer Ansible sur le runner
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y ansible

          echo "Version Ansible :"
          ansible --version

      - name: Vérifier l'inventaire et le playbook Ansible
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Structure de l'inventaire :"
          ansible-inventory \
            -i ansible/inventory.ini \
            --graph

          echo
          echo "Vérification syntaxique du playbook :"
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbooks/install-package.yml \
            --syntax-check

      - name: Vérifier ssh-agent pour Ansible
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -n "${SSH_AUTH_SOCK:-}" ]] || {
            echo "SSH_AUTH_SOCK est absent." >&2
            exit 1
          }

          [[ -S "${SSH_AUTH_SOCK}" ]] || {
            echo "Socket ssh-agent introuvable : ${SSH_AUTH_SOCK}" >&2
            exit 1
          }

          echo "Clé disponible dans ssh-agent :"
          ssh-add -l

      - name: Tester la connexion Ansible
        shell: bash
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
          ANSIBLE_FORCE_COLOR: "True"
        run: |
          set -Eeuo pipefail

          ansible \
            raspberry_nodes \
            -i ansible/inventory.ini \
            --private-key "${HOME}/.ssh/tunsa_ansible" \
            -m ansible.builtin.ping

      - name: Vérifier les permissions sudo
        shell: bash
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
          ANSIBLE_FORCE_COLOR: "True"
        run: |
          set -Eeuo pipefail

          ansible \
            raspberry_nodes \
            -i ansible/inventory.ini \
            --private-key "${HOME}/.ssh/tunsa_ansible" \
            -m ansible.builtin.command \
            -a "sudo -n id -u"

      - name: Installer htop avec Ansible
        shell: bash
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
          ANSIBLE_FORCE_COLOR: "True"
        run: |
          set -Eeuo pipefail

          ansible-playbook \
            -i ansible/inventory.ini \
            --private-key "${HOME}/.ssh/tunsa_ansible" \
            ansible/playbooks/install-package.yml \
            --extra-vars "package_to_install=htop"

      - name: Nettoyer SSH
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -n "${SSH_AGENT_PID:-}" ]]; then
            echo "Arrêt de ssh-agent..."
            ssh-agent -k >/dev/null 2>&1 || true
          else
            echo "Aucun ssh-agent à arrêter."
          fi

          rm -f \
            "${HOME}/.ssh/tunsa_ansible" \
            "${HOME}/.ssh/known_hosts" \
            "${RUNNER_TEMP}/ssh-askpass.sh"