---
name: Pipeline TUNSA — SSH et Ansible via Tailscale

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Paquet à installer avec Ansible
        required: true
        default: htop
        type: string

permissions:
  contents: read

concurrency:
  group: tunsa-tailscale-ansible
  cancel-in-progress: false

env:
  ANSIBLE_INVENTORY: ansible/inventory.ini
  ANSIBLE_PLAYBOOK: ansible/playbooks/install-package.yml
  NODE_1_IP: 10.50.0.11
  NODE_2_IP: 10.50.0.12

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1 — Validation statique
  # ---------------------------------------------------------------------------
  validate-ansible:
    name: 1 — Valider Ansible
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les fichiers requis
        shell: bash
        run: |
          set -Eeuo pipefail

          for file in "${ANSIBLE_INVENTORY}" "${ANSIBLE_PLAYBOOK}"; do
            [[ -f "${file}" ]] || {
              echo "Fichier absent : ${file}" >&2
              exit 1
            }

            echo "Fichier trouvé : ${file}"
          done

      - name: Installer Ansible pour la validation
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y ansible
          ansible --version

      - name: Valider l'inventaire et le playbook
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Structure de l'inventaire :"
          ansible-inventory \
            -i "${ANSIBLE_INVENTORY}" \
            --graph

          echo
          echo "Vérification syntaxique du playbook :"
          ansible-playbook \
            -i "${ANSIBLE_INVENTORY}" \
            "${ANSIBLE_PLAYBOOK}" \
            --syntax-check

  # ---------------------------------------------------------------------------
  # STAGE 2 — Test de la connectivité et de SSH
  # ---------------------------------------------------------------------------
  test-ssh:
    name: 2 — Tester SSH
    needs: validate-ansible
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer l'accès TUNSA
        uses: ./.github/actions/setup-tunsa-access
        with:
          tailscale_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_key_passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          ssh_known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          node_1_ip: ${{ env.NODE_1_IP }}
          node_2_ip: ${{ env.NODE_2_IP }}

      - name: Tester les deux émulateurs par SSH
        shell: bash
        run: |
          set -Eeuo pipefail

          [[ -n "${SSH_AUTH_SOCK:-}" ]] || {
            echo "SSH_AUTH_SOCK est absent." >&2
            exit 1
          }

          [[ -S "${SSH_AUTH_SOCK}" ]] || {
            echo "Socket ssh-agent introuvable : ${SSH_AUTH_SOCK}" >&2
            exit 1
          }

          ssh-add -l

          wait_for_ssh() {
            local host="$1"
            local attempt

            for attempt in $(seq 1 12); do
              echo "Tentative ${attempt}/12 vers ${host}:22..."

              if timeout 4 bash -c \
                "exec 3<>/dev/tcp/${host}/22" 2>/dev/null; then
                echo "Le port SSH répond sur ${host}."
                return 0
              fi

              sleep 5
            done

            echo "Le port SSH ne répond pas sur ${host}." >&2
            return 1
          }

          test_node() {
            local host="$1"
            local user="$2"
            local expected_hostname="$3"
            local expected_user="$4"

            echo
            echo "========================================"
            echo "Test de ${expected_hostname}"
            echo "Adresse : ${host}"
            echo "Compte  : ${user}"
            echo "========================================"

            wait_for_ssh "${host}"

            ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o "IdentityAgent=${SSH_AUTH_SOCK}" \
              -o ConnectTimeout=10 \
              -o ConnectionAttempts=2 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              -i "${HOME}/.ssh/tunsa_ansible" \
              "${user}@${host}" \
              bash -s -- \
              "${expected_hostname}" \
              "${expected_user}" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          expected_hostname="$1"
          expected_user="$2"

          actual_hostname="$(hostname)"
          actual_user="$(whoami)"
          actual_architecture="$(uname -m)"
          ssh_status="$(systemctl is-active ssh)"

          [[ "${actual_hostname}" == "${expected_hostname}" ]] || {
            echo "Hostname incorrect : ${actual_hostname}" >&2
            exit 1
          }

          [[ "${actual_user}" == "${expected_user}" ]] || {
            echo "Utilisateur incorrect : ${actual_user}" >&2
            exit 1
          }

          [[ "${actual_architecture}" == "aarch64" ]] || {
            echo "Architecture incorrecte : ${actual_architecture}" >&2
            exit 1
          }

          [[ "${ssh_status}" == "active" ]] || {
            echo "Service SSH non actif : ${ssh_status}" >&2
            exit 1
          }

          echo "SSH_OK"
          echo "Hostname     : ${actual_hostname}"
          echo "Utilisateur  : ${actual_user}"
          echo "Architecture : ${actual_architecture}"
          echo "Service SSH  : ${ssh_status}"
          REMOTE_SCRIPT
          }

          test_node \
            "${NODE_1_IP}" \
            "omar" \
            "raspberry-pi-01" \
            "omar"

          test_node \
            "${NODE_2_IP}" \
            "omar2" \
            "raspberry-pi-02" \
            "omar2"

      - name: Nettoyer SSH
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -n "${SSH_AGENT_PID:-}" ]]; then
            ssh-agent -k >/dev/null 2>&1 || true
          fi

          rm -f \
            "${HOME}/.ssh/tunsa_ansible" \
            "${HOME}/.ssh/known_hosts" \
            "${RUNNER_TEMP}/ssh-askpass.sh"

  # ---------------------------------------------------------------------------
  # STAGE 3 — Déploiement avec Ansible
  # ---------------------------------------------------------------------------
  deploy-ansible:
    name: 3 — Déployer avec Ansible
    needs: test-ssh
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Ansible sur le runner
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y ansible
          ansible --version

      - name: Préparer l'accès TUNSA
        uses: ./.github/actions/setup-tunsa-access
        with:
          tailscale_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tailscale_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_key_passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }}
          ssh_known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          node_1_ip: ${{ env.NODE_1_IP }}
          node_2_ip: ${{ env.NODE_2_IP }}

      - name: Tester la connexion Ansible
        shell: bash
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
          ANSIBLE_FORCE_COLOR: "True"
        run: |
          set -Eeuo pipefail

          ansible \
            raspberry_nodes \
            -i "${ANSIBLE_INVENTORY}" \
            --private-key "${HOME}/.ssh/tunsa_ansible" \
            -m ansible.builtin.ping

      - name: Vérifier les permissions sudo
        shell: bash
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
          ANSIBLE_FORCE_COLOR: "True"
        run: |
          set -Eeuo pipefail

          ansible \
            raspberry_nodes \
            -i "${ANSIBLE_INVENTORY}" \
            --private-key "${HOME}/.ssh/tunsa_ansible" \
            -m ansible.builtin.command \
            -a "sudo -n id -u"

      - name: Installer le paquet avec Ansible
        shell: bash
        env:
          ANSIBLE_HOST_KEY_CHECKING: "True"
          ANSIBLE_FORCE_COLOR: "True"
        run: |
          set -Eeuo pipefail

          ansible-playbook \
            -i "${ANSIBLE_INVENTORY}" \
            --private-key "${HOME}/.ssh/tunsa_ansible" \
            "${ANSIBLE_PLAYBOOK}" \
            --extra-vars "package_to_install=${{ inputs.package_name }}"

      - name: Nettoyer SSH
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -n "${SSH_AGENT_PID:-}" ]]; then
            ssh-agent -k >/dev/null 2>&1 || true
          fi

          rm -f \
            "${HOME}/.ssh/tunsa_ansible" \
            "${HOME}/.ssh/known_hosts" \
            "${RUNNER_TEMP}/ssh-askpass.sh"